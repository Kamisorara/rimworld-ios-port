name: m1-probe

on:
  push:
    branches: [main]
  workflow_dispatch:

# 排队不取消：防止缓存尚未保存时新 run 触发重复的长时间编译
concurrency:
  group: m1-probe-${{ github.ref }}
  cancel-in-progress: false

# gh release create/upload 需要写权限
permissions:
  contents: write

jobs:
  runtime:
    # 仅在 runtime-pin.txt 变化后重建（缓存命中即跳过编译）
    runs-on: macos-15
    timeout-minutes: 300
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算 pin 与缓存键
        id: key
        run: |
          PIN="$(head -n1 runtime-pin.txt | tr -d '[:space:]')"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          # 补丁或收集逻辑变化时把后缀升级一位，强制重跑（也要重编译，runner 上没有源产物）
          # c5 = 双JIT竞技场补丁（替换 jit-write-protect-ios.patch）
          # c12 = JIT26 协议（扫描 → brk 握手 + 提前分离，PLAN-JIT26.md）
          echo "key=runtime-ios-arm64-$PIN-c15" >> "$GITHUB_OUTPUT"

      - name: 查缓存
        id: cache
        uses: actions/cache@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: runtime-out
          lookup-only: true

      - name: 清理磁盘
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android ~/Library/Android || true
          df -h /

      - name: 构建 CoreCLR + BCL（iOS arm64，JIT）
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build-runtime.sh

      # 收集只告警不失败：编译产物在任何情况下都要进入下面的保存步骤
      - name: 收集运行时产物
        if: steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        run: ./scripts/collect-runtime.sh

      - name: 保存缓存
        if: steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: runtime-out

      # Actions 缓存 7 天未访问即逐出；Release 附件永久，作为复用的最终兜底
      - name: 发布运行时产物到 Release
        if: steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -e "runtime-out/managed/System.Private.CoreLib.dll" ] || [ ! -e "runtime-out/libcoreclr.dylib" ]; then
            echo "产物不完整，暂不发布 Release（Artifacts 里保留了原始输出供排查）"
            exit 0
          fi
          PIN="${{ steps.key.outputs.pin }}"
          cd runtime-out
          zip -qry "../runtime-ios-arm64-$PIN.zip" .
          cd ..
          gh release create "runtime-$PIN" "runtime-ios-arm64-$PIN.zip" \
            --title "Runtime iOS arm64 (JIT) $PIN" \
            --notes "dotnet/runtime $PIN，iOS arm64，--dynamiccodecompiled true。缓存逐出后由 ipa job 自动从此恢复；本地 mac 调试也可下载解压到 runtime-out/ 复用。" \
            || gh release upload "runtime-$PIN" "runtime-ios-arm64-$PIN.zip" --clobber

      - name: 上传运行时产物（排查用）
        if: steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ios-arm64
          path: runtime-out
          retention-days: 7
          if-no-files-found: warn

  ipa:
    needs: runtime
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 取运行时缓存
        uses: actions/cache/restore@v4
        with:
          key: ${{ needs.runtime.outputs.cache-key }}
          path: runtime-out

      - name: 缓存未命中则从 Release 恢复
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(ls -A runtime-out 2>/dev/null)" ]; then
            echo "缓存命中"
            exit 0
          fi
          PIN="$(head -n1 runtime-pin.txt | tr -d '[:space:]')"
          echo "缓存未命中（可能被逐出），从 Release runtime-$PIN 恢复"
          gh release download "runtime-$PIN" -p "runtime-ios-arm64-$PIN.zip" --clobber
          mkdir -p runtime-out
          unzip -q "runtime-ios-arm64-$PIN.zip" -d runtime-out
          ls runtime-out

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 打 IPA
        run: ./probe/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: port17probe-ipa
          path: build/port17probe.ipa
          retention-days: 14
