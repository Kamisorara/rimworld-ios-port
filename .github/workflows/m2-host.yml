name: m2-host

# M2 宿主层：UIKit 宿主（CAMetalLayer + 触摸 + 软键盘桥）+ GLFW 垫片 iOS 后端 +
# Vulkan 前向层 → MoltenVK，三角形验证渲染（无 CoreCLR 依赖，原生路径全通）。
# MoltenVK 按 sha256 缓存（钉死的版本，见 host/fetch-moltenvk.sh）。
on:
  push:
    branches: [main]
    paths:
      - 'host/**'
      - 'scripts/fetch-official-runtime.sh'
      - 'scripts/fetch-hybrid-runtime.sh'
      - '.github/workflows/m2-host.yml'
  workflow_dispatch:

jobs:
  m2-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: MoltenVK（按 sha256 缓存）
        uses: actions/cache@v4
        with:
          path: build-moltenvk
          key: moltenvk-v1.4.2-b5d947b1660e6e9fed40b9cd2387e160aaab9e80b775c0cef7e14059405178c1

      - name: 取 MoltenVK（缓存未命中才下载，校验和钉死）
        run: ./host/fetch-moltenvk.sh

      - name: 原生库源码（miniaudio/stb/VMA/gli/glm/astcenc/KTX/imgui/freetype，安卓仓库同钉版本）
        uses: actions/cache@v4
        with:
          path: build-native-deps
          key: native-deps-v3

      - name: 取原生库源码（缓存未命中才下载）
        run: ./host/fetch-native-deps.sh

      - name: Slang 2026.19（源码+产物整体缓存，首建约半小时）
        uses: actions/cache@v4
        with:
          path: build-slang
          key: slang-2026.19-0fb6b758-bv1

      - name: 取 Slang 源码并编译 iOS arm64 三件库
        run: |
          ./host/fetch-slang.sh
          ./host/build-slang.sh

      - name: 取自建混合运行时（m1-probe 的 Release 资产：JIT 静态链入 + 解释器 dylib）
        run: ./scripts/fetch-hybrid-runtime.sh
        env:
          # 不带令牌时 gh 走匿名 API——共享 runner IP 撞限流 403（0.3.1 首派就折在这里）
          GH_TOKEN: ${{ github.token }}

      - name: glslang（三角形 SPIR-V）
        run: brew install glslang

      - name: 打 M2 宿主 IPA
        run: ./host/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: port17host-m2-ipa
          path: build-m2/port17host-m2.ipa
          retention-days: 30
