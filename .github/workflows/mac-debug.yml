name: mac-debug

# 在 macOS runner 上复现宿主调用：官方 osx-arm64 包 + 自带 .NET SDK 运行时两个对照组，
# 属性组变体矩阵二分，定位 coreclr_initialize 0x80070002。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'probe/app/**'
      - 'probe/hello/**'
      - 'probe/debug/**'
      - 'scripts/build-runtime.sh'
      - 'scripts/collect-runtime.sh'
      - 'patches/**'
      - 'runtime-pin.txt'
      - '.github/workflows/mac-debug.yml'

jobs:
  # 模拟器复现：同一 pin + 同一补丁编出的 iossimulator 版自建 runtime，
  # 在 mac 宿主上原生运行（无签名、JIT 自由），lldb 全开——
  # 真机黑盒问题的主调试环（官方 osx 包只是对照组，跑的不是我们改过的 runtime）。
  sim-repro:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 计算 pin 与缓存键
        id: key
        run: |
          PIN="$(head -n1 runtime-pin.txt | tr -d '[:space:]')"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "key=runtime-sim-arm64-$PIN-c1" >> "$GITHUB_OUTPUT"

      - name: 查缓存
        id: cache
        uses: actions/cache@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: runtime-out-sim
          lookup-only: true

      - name: 恢复缓存
        if: steps.cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: runtime-out-sim

      - name: 清理磁盘
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android ~/Library/Android || true
          df -h /

      - name: 构建 simulator 版 CoreCLR + BCL（JIT，带补丁）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-runtime.sh --sim
          ./scripts/collect-runtime.sh --sim

      - name: 保存缓存
        if: steps.cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: runtime-out-sim

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 组装并运行（lldb 全开）
        run: |
          dotnet build probe/hello/hello.csproj -c Release -o probe/build/hello-out
          mkdir -p bundle-sim
          cp runtime-out-sim/*.dylib bundle-sim/
          cp runtime-out-sim/managed/*.dll bundle-sim/
          cp probe/build/hello-out/Hello.dll bundle-sim/
          cp probe/build/hello-out/Hello.runtimeconfig.json bundle-sim/
          ls bundle-sim | wc -l
          # 模拟器目标的二进制在 mac 宿主上原生可跑
          xcrun -sdk iphonesimulator clang -arch arm64 \
            -target arm64-apple-ios15.0-simulator \
            -Wl,-rpath,@executable_path \
            -I probe/app \
            probe/debug/debug-main.c probe/app/host.c \
            -o macprobe-sim
          set +e
          # 直接跑需要 dyld_sim 的一整套环境——走 simctl spawn（启动模拟器设备并在其中运行）
          UDID=$(xcrun simctl list devices available | grep -oE "[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}" | head -n1)
          echo "模拟器设备：$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "==== 变体 A：默认（W^X 开）===="
          xcrun simctl spawn "$UDID" "$PWD/macprobe-sim" "$PWD/bundle-sim" A
          echo "A exit=$?"
          echo "==== 变体 B：属性 EnableWriteXorExecute=0 ===="
          xcrun simctl spawn "$UDID" "$PWD/macprobe-sim" "$PWD/bundle-sim" B
          echo "B exit=$?"
          echo "==== 变体 C：环境变量 COMPlus_EnableWriteXorExecute=0 ===="
          xcrun simctl spawn "$UDID" env COMPlus_EnableWriteXorExecute=0 "$PWD/macprobe-sim" "$PWD/bundle-sim" A
          echo "C exit=$?"
          echo "---- hello.log ----"
          cat bundle-sim/hello.log 2>/dev/null || echo "（无）"
          exit 0

  debug:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 取官方 osx-arm64 运行时包
        run: |
          PKG="microsoft.netcore.app.runtime.osx-arm64"
          VER=$(curl -sL "https://nuget.azure.cn/v3-flatcontainer/$PKG/index.json" | tr ',' '\n' | grep -o '"11\.0\.0-rc\.3[^"]*"' | tail -n1 | tr -d '"')
          echo "版本 $VER"
          curl -sL -o pack.nupkg "https://nuget.azure.cn/v3-flatcontainer/$PKG/$VER/$PKG.$VER.nupkg"
          unzip -q pack.nupkg -d pack

      - name: 编 Hello 与探针
        run: |
          dotnet build probe/hello/hello.csproj -c Release -o probe/build/hello-out
          # 拍平布局（官方包 lib/net11.0 + native/ 合一目录——app bundle 的标准形态）
          mkdir -p bundle
          cp pack/runtimes/osx-arm64/native/*.dylib bundle/
          cp pack/runtimes/osx-arm64/lib/net11.0/*.dll bundle/
          cp pack/runtimes/osx-arm64/lib/net11.0/*.dylib bundle/ 2>/dev/null || true
          cp probe/build/hello-out/Hello.dll bundle/
          cp probe/build/hello-out/Hello.runtimeconfig.json bundle/
          # 布局 B：SDK 10.x 运行时（天然平铺）
          # 布局 B：SDK 10.x 运行时（天然平铺）
          SDKRUNTIME=$(ls -d ~/.dotnet/shared/Microsoft.NETCore.App/*/ | sort -V | grep -E '/10\.' | tail -n1)
          echo "SDK 运行时: $SDKRUNTIME"
          mkdir -p bundle10
          cp "$SDKRUNTIME"/*.dll bundle10/
          cp "$SDKRUNTIME"/*.dylib bundle10/
          cp probe/build/hello-out/Hello.dll bundle10/
          clang -arch arm64 -I probe/app -Wl,-rpath,@executable_path \
            probe/debug/debug-main.c probe/app/host.c \
            -o macprobe

      - name: 对照组 1——官方 osx 包布局
        run: ./macprobe "$PWD/bundle" || true

      - name: 对照组 2——SDK 10.0.x 运行时（平铺布局）
        run: ./macprobe "$PWD/bundle10" flat || true

      - name: 对照组 3——官方 dotnet 宿主直接跑 bundle10
        run: ~/.dotnet/dotnet bundle10/Hello.dll || true

      - name: lldb 拿 macprobe 崩溃栈
        if: always()
        run: |
          lldb -b \
            -o "run" \
            -k "thread backtrace all" \
            -k "register read x0 x1 pc" \
            -k "quit" \
            ./macprobe "$PWD/bundle10" flat 2>&1 || true
          echo "---- hello.log（探针进度）----"
          cat bundle10/hello.log 2>/dev/null || echo "（无）"
