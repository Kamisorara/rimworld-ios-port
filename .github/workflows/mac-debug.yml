name: mac-debug

# 在 macOS runner 上复现宿主调用：官方 osx-arm64 包 + 自带 .NET SDK 运行时两个对照组，
# 属性组变体矩阵二分，定位 coreclr_initialize 0x80070002。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'probe/app/**'
      - 'probe/hello/**'
      - 'probe/debug/**'
      - '.github/workflows/mac-debug.yml'

jobs:
  debug:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 取官方 osx-arm64 运行时包
        run: |
          PKG="microsoft.netcore.app.runtime.osx-arm64"
          VER=$(curl -sL "https://nuget.azure.cn/v3-flatcontainer/$PKG/index.json" | tr ',' '\n' | grep -o '"11\.0\.0-rc\.3[^"]*"' | tail -n1 | tr -d '"')
          echo "版本 $VER"
          curl -sL -o pack.nupkg "https://nuget.azure.cn/v3-flatcontainer/$PKG/$VER/$PKG.$VER.nupkg"
          unzip -q pack.nupkg -d pack

      - name: 编 Hello 与探针
        run: |
          dotnet build probe/hello/hello.csproj -c Release -o probe/build/hello-out
          # 拍平布局（官方包 lib/net11.0 + native/ 合一目录——app bundle 的标准形态）
          mkdir -p bundle
          cp pack/runtimes/osx-arm64/native/*.dylib bundle/
          cp pack/runtimes/osx-arm64/lib/net11.0/*.dll bundle/
          cp pack/runtimes/osx-arm64/lib/net11.0/*.dylib bundle/ 2>/dev/null || true
          cp probe/build/hello-out/Hello.dll bundle/
          cp probe/build/hello-out/Hello.runtimeconfig.json bundle/
          # 布局 B：SDK 10.x 运行时（天然平铺）
          # 布局 B：SDK 10.x 运行时（天然平铺）
          SDKRUNTIME=$(ls -d ~/.dotnet/shared/Microsoft.NETCore.App/*/ | sort -V | grep -E '/10\.' | tail -n1)
          echo "SDK 运行时: $SDKRUNTIME"
          mkdir -p bundle10
          cp "$SDKRUNTIME"/*.dll bundle10/
          cp "$SDKRUNTIME"/*.dylib bundle10/
          cp probe/build/hello-out/Hello.dll bundle10/
          clang -arch arm64 -I probe/app -Wl,-rpath,@executable_path \
            probe/debug/debug-main.c probe/app/host.c \
            -o macprobe

      - name: 对照组 1——官方 osx 包布局
        run: ./macprobe "$PWD/bundle" || true

      - name: 对照组 2——SDK 10.0.x 运行时（平铺布局）
        run: ./macprobe "$PWD/bundle10" flat || true

      - name: 对照组 3——官方 dotnet 宿主直接跑 bundle10
        run: ~/.dotnet/dotnet bundle10/Hello.dll || true

      - name: lldb 拿 macprobe 崩溃栈
        if: always()
        run: |
          lldb -b \
            -o "settings set target.process.stop-on-exec false" \
            -o run -o "bt 25" -o quit \
            ./macprobe "$PWD/bundle10" flat 2>&1 | tail -40 || true
